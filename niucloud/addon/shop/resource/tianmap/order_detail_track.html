<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
    <link rel="icon" type="image" href="./favicon.ico"/>
    <title>地图位置</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        .map-wrap {
        }

        #mapDiv {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100vh;
        }
    </style>
    <script>
        var map;
        var zoom = 16;
        var mapApiKey = '';
        var selectedLongitude = 116.391349;
        var selectedLatitude = 39.907375;
        var polyline = []
        var memberId = 0
        var tradeNo = ''

        function loadTianDiTuScript(key) {
            return new Promise(function (resolve, reject) {
                if (window.T) {
                    resolve();
                    return;
                }
                var script = document.createElement('script');
                script.type = 'text/javascript';
                script.src = 'https://api.tianditu.gov.cn/api?v=4.0&tk=' + key;
                script.onload = function () {
                    resolve();
                };
                script.onerror = function () {
                    reject(new Error('load script error'));
                };
                document.head.appendChild(script);
            });
        }

        function getQueryObject() {
            const params = new URLSearchParams(window.location.search)
            return Object.fromEntries(params.entries())
        }

        function onLoad() {
            // 从URL参数中获取地图key
            var key = getQueryParam('key') || '';
            if (!key) {
                // alert('地图key为空');
                return;
            }
            mapApiKey = key;
            loadTianDiTuScript(key).then(function () {
                map = new T.Map('mapDiv');

                var query = getQueryObject();
                memberId = query.member_id || 0
                tradeNo = query.trade_no || ''

                getData().then(function (res) {
                    var data = res.data
                    selectedLatitude = data.center.latitude
                    selectedLongitude = data.center.longitude

                    if (data && data.points) {
                        data.points.forEach(async (item) => {
                            item.id = getRandomInt(1, 200)

                            //创建标注对象
                            if (item.callout.content) {
                                var latlng = new T.LngLat(item.longitude, item.latitude);
                                var label = new T.Label({
                                    text: item.callout.content,
                                    position: latlng,
                                    offset: new T.Point(-10, 0)
                                });
                                label.setFontColor('#fff')
                                label.setBackgroundColor('#fa5050')
                                //创建地图文本对象
                                map.addOverLay(label);
                            }

                            getValidImage(location.origin + '/' + item.icon_path)
                            // 使用示例
                            const imgUrl = await getValidImage(location.origin + '/' + item.icon_path)

                            //创建图片对象
                            var icon = new T.Icon({
                                iconUrl: imgUrl,
                                iconSize: new T.Point(40, 40),
                                iconAnchor: new T.Point(40, 40)
                            });

                            //向地图上添加自定义标注
                            var marker = new T.Marker(new T.LngLat(item.longitude, item.latitude), { icon: icon });
                            //向地图上添加标注
                            map.addOverLay(marker);

                        })
                        processRouteData(data.driving)
                        zoom = estimateZoomLevel(haversineDistance(data.points[0].latitude, data.points[0].longitude, data.points[1].latitude, data.points[data.points.length - 1].longitude))
                    }

                    map.centerAndZoom(new T.LngLat(selectedLongitude, selectedLatitude), zoom);

                    //创建线对象
                    var line = new T.Polyline(polyline, {
                        color: '#fa5050', // 折线颜色
                        weight: 4, // 折线的宽度
                        opacity: 1
                    });
                    //向地图上添加线
                    map.addOverLay(line);

                });

            }).catch(function () {
                // alert('地图加载失败');
            });
        }

        function getQueryParam(name) {
            var match = window.location.search.match(new RegExp('(?:\\?|&)' + name + '=([^&]*)'));
            return match ? decodeURIComponent(match[1]) : '';
        }

        function getData() {
            return fetch(`/api/shop/delivery/track_of_local?member_id=${ memberId }&trade_no=${ tradeNo }`, {
                credentials: 'include',
                headers: {
                    'Content-Type': 'application/json',
                    'token': 'eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJtZW1iZXJfaWQiOjEwMTEzLCJ1c2VybmFtZSI6InprZiIsInNpdGVfaWQiOjE0MCwiaXNzIjoibml1Y2xvdWRhZG1pbnNhc3MiLCJhdWQiOiJuaXVjbG91ZGFkbWluc2FzcyIsImlhdCI6MTc3NTAzMjg4MSwibmJmIjoxNzc1MDMyODgxLCJleHAiOjE3Nzc2MjQ4ODEsImp0aSI6IjEwMTEzX2FwaSJ9.drceD9Nn8V70dhNadoZxWiv6QA8mu3zkrDezcMedg_4'
                }
            }).then(function (response) {
                return response.json();
            });
        }

        function processRouteData(result) {
            if (!result) {
                return false
            }

            var route = result.routes[0];
            var coords = route.polyline;

            // 坐标解压（腾讯地图采用的压缩算法）
            var kr = 1000000;
            for (let i = 2; i < coords.length; i++) {
                coords[i] = Number(coords[i - 2]) + Number(coords[i]) / kr;
            }

            // 转换为polyline数据格式
            polyline = [];
            for (let i = 0; i < coords.length; i += 2) {
                polyline.push(new T.LngLat(coords[i + 1], coords[i]));
            }
        }

        function estimateZoomLevel(distance) {
            let zoomLevel;
            if (distance > 1000000) {
                zoomLevel = 5 - ((distance - 1000000) / 3000000) * 10;
            } else if (distance > 100000 && distance <= 1000000) {
                zoomLevel = 7 + ((distance - 100000) / 900000) * 6;
            } else if (distance > 50000 && distance <= 100000) {
                zoomLevel = 10 + (distance / 1000000) * 9;
            } else if (distance > 10000 && distance <= 50000) {
                zoomLevel = 11 + (distance / 1000000) * 6.5;
            } else if (distance > 5000 && distance <= 10000) {
                zoomLevel = 13 + (distance / 100000) * 6;
            } else if (distance > 900 && distance <= 5000) {
                zoomLevel = 14 + (distance / 100000) * 8;
            } else if (distance > 500 && distance <= 900) {
                zoomLevel = 16 + (distance / 10000) * 3;
            } else if (distance > 100 && distance <= 500) {
                zoomLevel = 16.5 + (distance / 10000) * 2;
            } else {
                zoomLevel = 17 + (distance / 10000) * 2;
            }
            // 限制缩放级别在合理范围内，假设缩放级别范围是3 - 17
            return parseInt(Math.max(3, Math.min(19, zoomLevel)) - 1);
        }

        function haversineDistance(lat1, lon1, lat2, lon2) {
            var R = 6371; // 地球半径，单位为公里
            var dLat = deg2rad(lat2 - lat1);
            var dLon = deg2rad(lon2 - lon1);
            var a =
                Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
            var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            var distance = R * c; // 距离，单位为公里
            return distance * 1000;
        }

        function deg2rad(deg) {
            return deg * (Math.PI / 180);
        }

        function getRandomInt(min, max) {
            min = Math.ceil(min);
            max = Math.floor(max);
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }
        /**
         * 获取有效图片，失败则返回默认图
         * @param {string} src 原图地址
         * @param {string} defaultSrc 默认图地址
         * @returns {Promise<string>} 最终可用的图片地址
         */
        async function getValidImage(src, defaultSrc = location.origin + '/static/resource/images/default_headimg.png') {
            try {
                await new Promise((resolve, reject) => {
                    const img = new Image()
                    img.onload = resolve
                    img.onerror = reject
                    img.src = src + (src.includes('?') ? '&' : '?') + '_t=' + Date.now()

                    setTimeout(() => reject('timeout'), 5000)
                })
                return src
            } catch (err) {
                return defaultSrc
            }
        }
    </script>
</head>
<body onLoad="onLoad()">
<div class="map-wrap">
    <div id="mapDiv"></div>
</div>
</body>
</html>
